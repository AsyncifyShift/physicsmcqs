<style>

html { scroll-padding-top: env(safe-area-inset-top, 0px); }

}
* { box-sizing: border-box; }
body {
  margin: 0 auto;
  background: var(--bg);
  color: var(--fg);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  line-height: 1.45;
  padding: 0 14px 40px;
  max-width: 760px;
  width: 100%;
  overflow-x: hidden;
}
h1 { font-size: 1.25rem; color: var(--acc); margin: 16px 0 2px; }
.sub { color: var(--mut); font-size: 0.85rem; margin-bottom: 12px; }
.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  background: var(--bg);
  padding: 10px 0;
  z-index: 5;
  border-bottom: 1px solid var(--bd);
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
select {
  font: inherit;
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid var(--bd);
  background: var(--card);
  color: var(--fg);
  outline: none;
}
button {
  font: inherit;
  border: 0;
  border-radius: 8px;
  background: var(--btn);
  color: var(--btnfg);
  padding: 8px 14px;
  font-weight: 600;
  cursor: pointer;
}
button.sm { font-size: 0.85rem; padding: 6px 12px; }
a.nav-link {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--btnfg);
  background: var(--acc);
  text-decoration: none;
  padding: 6px 12px;
  border-radius: 8px;
  margin-left: auto;
}
section { background: var(--card); border-radius: 12px; padding: 12px 14px; margin: 14px 0; }
h2 { font-size: 1.05rem; color: var(--acc); margin: 0 0 10px; border-bottom: 1px dashed var(--bd); padding-bottom: 6px; }
.q { margin: 14px 0; word-break: break-word; }
.tag { font-size: 0.75rem; background: var(--tag); color: var(--tagfg); padding: 2px 6px; border-radius: 4px; font-weight: 600; margin-left: 6px; display: inline-block; }
.o { padding: 6px 10px; border-radius: 6px; margin: 3px 0; font-size: 0.95rem; width: 100%; text-align: left; }
.show .o.c { background: var(--okbg); color: var(--ok); font-weight: 700; }
.ans { display: none; color: var(--ok); font-weight: 700; font-size: 0.9rem; margin: 10px 0 6px; }
.show .ans { display: block; }
</style>

var L = "ABCD";
var app = document.getElementById("app");
var chSel = document.getElementById("chSel");
var allBtn = document.getElementById("all");
var secs = [];

function getActiveData() {
  return DATA;
}

function loadMcqMode() {
  var data = getActiveData();
  app.innerHTML = "";
  chSel.innerHTML = '<option value="all">All Chapters</option>';
  secs = [];

  data.forEach(function(c, idx) {
    var opt = document.createElement("option");
    opt.value = idx;
    opt.textContent = c[0];
    chSel.appendChild(opt);

    var s = document.createElement("section");
    s.dataset.idx = idx;
    
    var h = "<h2>" + c[0] + "</h2>";
    c[1].forEach(function(r, i) {
      h += '<div class="q"><b>Q' + (i + 1) + '.</b> ' + r[0];
      r[1].forEach(function(o, j) {
        h += '<div class="o' + (j === r[2] ? " c" : "") + '">(' + L[j] + ') ' + o + '</div>';
      });
      h += '</div>';
    });
    
    h += '<button class="sm">Show answers</button>';
    
    s.innerHTML = h;
    app.appendChild(s);
    secs.push(s);

    var b = s.querySelector("button");
    b.onclick = function() {
      s.classList.toggle("show");
      b.textContent = s.classList.contains("show") ? "Hide answers" : "Show answers";
      syncAllBtn();
    };
  });

  filterChapters();
}

function filterChapters() {
  var val = chSel.value;
  secs.forEach(function(s) {
    if (val === "all" || s.dataset.idx === val) {
      s.style.display = "block";
    } else {
      s.style.display = "none";
    }
  });
  syncAllBtn();
}

chSel.onchange = function() {
  filterChapters();
};

function syncAllBtn() {
  var visibleSecs = secs.filter(function(s) { return s.style.display !== "none"; });
  var shownSecs = visibleSecs.filter(function(s) { return s.classList.contains("show"); });
  allBtn.textContent = (shownSecs.length === visibleSecs.length && visibleSecs.length > 0) ? "Hide all answers" : "Show all answers";
}

allBtn.onclick = function() {
  var visibleSecs = secs.filter(function(s) { return s.style.display !== "none"; });
  var shouldShow = visibleSecs.some(function(s) { return !s.classList.contains("show"); });
  
  visibleSecs.forEach(function(s) {
    s.classList.toggle("show", shouldShow);
    s.querySelector("button").textContent = shouldShow ? "Hide answers" : "Show answers";
  });
  syncAllBtn();
};

loadMcqMode();
</script>
